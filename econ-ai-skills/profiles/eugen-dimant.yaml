# Core Research Themes
research_themes:
  social_norms:
    description: How social norms emerge, are enforced, and erode
    key_questions:
      - How does norm disagreement influence behavior?
      - How do descriptive vs. injunctive norms differ in effects?
      - What role does social proximity play in norm compliance?

  behavioral_contagion:
    description: Spread of pro- and anti-social behavior among peers
    key_questions:
      - How does observing norm violations affect own compliance?
      - What is the role of social identity in behavioral contagion?
      - How do peer effects operate in charitable giving?

  political_polarization:
    description: Impact of polarization on social preferences and behavior
    key_questions:
      - How does polarization affect cooperation and trust?
      - Do behavioral interventions work across partisan lines?
      - What is the structure of norm pluralism in politics?

  dishonesty_and_ethics:
    description: Lying, cheating, and enforcement of ethical norms
    key_questions:
      - How do people justify dishonesty through norm perceptions?
      - What drives punishment of norm violations?
      - When do nudges for honesty backfire?

  corruption_and_terrorism:
    description: Political economy of corruption and anti-American terrorism
    key_questions:
      - How does military aid affect terrorism?
      - What are transmission channels for corruption?
      - How do institutional factors interact with foreign policy?

